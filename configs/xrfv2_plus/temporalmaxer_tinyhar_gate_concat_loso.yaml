name: temporalmaxer
dataset_name: xrfv2_plus_multimodal
train_split:
- training
val_split:
- validation
devices:
- 0
anno_json:
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s00.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s01.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s02.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s03.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s04.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s05.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s06.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s07.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s08.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s09.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s10.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s11.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s12.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s13.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s14.json
- data/xrfv2_plus/annotations/loso/xrfv2_plus_loso_s15.json
dataset:
  feat_folder: ./data/xrfv2_plus/processed/combined_features/imu_flatten_video_1hz
  sens_folder: ./data/xrfv2_plus/raw/labels_1hz
  sampling_rate: 1
  file_prefix: null
  file_ext: .npy
  feat_stride: 1
  num_frames: 1
  input_dim: 1024
  num_classes: 34
  downsample_rate: 1
  max_seq_len: 256
  trunc_thresh: 0.5
  crop_ratio:
  - 0.9
  - 1.0
  tiou_thresholds:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  default_fps: 1.0
  force_upsampling: false
  imu_flat_dim: 1500
  video_dim: 1024
  imu_window_size: 50
  imu_input_dim: 30
train_cfg:
  loss_weight: 1.0
  cls_prior_prob: 0.01
  center_sample: null
  init_loss_norm: 250
  clip_grad_l2norm: 1.0
  head_empty_cls: []
  label_smoothing: 0.0
test_cfg:
  pre_nms_topk: 5000
  pre_nms_thresh: 0.001
  iou_threshold: 0.1
  min_score: 0.0
  max_seg_num: 2000
  nms_method: soft
  nms_sigma: 0.4
  duration_thresh: 0.05
  multiclass_nms: true
  voting_thresh: 0.75
  ext_score_file: null
opt:
  type: AdamW
  momentum: 0.9
  weight_decay: 0.05
  learning_rate: 0.0001
  epochs: 20
  warmup: false
  warmup_epochs: 0
  schedule_type: cosine
  schedule_steps: []
  schedule_gamma: 0.1
model:
  model_name: MultiModalTemporalMaxer
  backbone_type: convPooler
  fpn_type: identity
  fpn_norm: layernorm
  backbone_arch:
  - 2
  - 5
  scale_factor: 2
  regression_range:
  - - 0
    - 4
  - - 2
    - 8
  - - 4
    - 16
  - - 8
    - 32
  - - 16
    - 64
  - - 32
    - 10000
  embd_kernel_size: 3
  embd_dim: 512
  embd_with_ln: true
  fpn_dim: 512
  fpn_with_ln: true
  fpn_start_level: 0
  head_dim: 512
  head_kernel_size: 3
  head_num_layers: 3
  head_with_ln: true
  max_buffer_len_factor: 4.0
  assigner:
    iou_weight: 2
    cls_weight: 1.0
    center_radius: 1.5
    keep_percent: 1.0
    confuse_weight: 0.0
  video_dim: 1024
  imu_window_size: 50
  imu_input_dim: 30
  imu_project_dim: 1024
  fusion_dim: 512
  tinyhar_kwargs:
    number_class: 34
    filter_num: 64
    nb_conv_layers: 4
    filter_size: 5
    cross_channel_interaction_type: attn
    cross_channel_aggregation_type: FC
    temporal_info_interaction_type: lstm
    temporal_info_aggregation_type: naive
    dropout: 0.3
    projection_dropout: 0.1
  fusion_kwargs:
    dropout: 0.1
  input_dim: 512
  imu_encoder_type: tinyhar
  fusion_type: gate_concat
  raw_imu_project_dim: 1024
loader:
  batch_size: 4
  num_workers: 4
