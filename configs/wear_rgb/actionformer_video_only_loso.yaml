name: actionformer
dataset_name: wear_rgb_multimodal
train_split:
- training
val_split:
- validation
devices:
- 0
anno_json:
- ./data/wear/annotations/30fps/wear_split_1.json
- ./data/wear/annotations/30fps/wear_split_2.json
- ./data/wear/annotations/30fps/wear_split_3.json
- ./data/wear/annotations/30fps/wear_split_4.json
- ./data/wear/annotations/30fps/wear_split_5.json
- ./data/wear/annotations/30fps/wear_split_6.json
- ./data/wear/annotations/30fps/wear_split_7.json
- ./data/wear/annotations/30fps/wear_split_8.json
- ./data/wear/annotations/30fps/wear_split_9.json
- ./data/wear/annotations/30fps/wear_split_10.json
- ./data/wear/annotations/30fps/wear_split_11.json
- ./data/wear/annotations/30fps/wear_split_12.json
- ./data/wear/annotations/30fps/wear_split_13.json
- ./data/wear/annotations/30fps/wear_split_14.json
- ./data/wear/annotations/30fps/wear_split_15.json
- ./data/wear/annotations/30fps/wear_split_16.json
- ./data/wear/annotations/30fps/wear_split_17.json
- ./data/wear/annotations/30fps/wear_split_18.json
dataset:
  feat_folder: ./data/wear/processed/combined_features/30fps/60_frames_30_stride
  sens_folder: ./data/wear/raw/inertial/25hz
  sampling_rate: 25
  file_prefix: null
  file_ext: .npy
  feat_stride: 30
  num_frames: 60
  input_dim: 1024
  num_classes: 18
  downsample_rate: 1
  max_seq_len: 2304
  trunc_thresh: 0.3
  crop_ratio:
  - 0.9
  - 1.0
  tiou_thresholds:
  - 0.1
  - 0.15
  - 0.2
  - 0.25
  - 0.3
  - 0.35
  - 0.4
  - 0.45
  - 0.5
  - 0.55
  - 0.6
  - 0.65
  - 0.7
  - 0.75
  - 0.8
  - 0.85
  - 0.9
  default_fps: null
  force_upsampling: false
  imu_flat_dim: 600
  video_dim: 1024
  imu_window_size: 50
  imu_input_dim: 12
  rgb_start: 600
  feature_mode: video_only
  imu_normalize: none
model:
  model_name: LocPointTransformer
  backbone_type: convTransformer
  fpn_type: identity
  backbone_arch:
  - 2
  - 2
  - 5
  scale_factor: 2
  regression_range:
  - - 0
    - 4
  - - 2
    - 8
  - - 4
    - 16
  - - 8
    - 32
  - - 16
    - 64
  - - 32
    - 10000
  n_head: 4
  n_mha_win_size: 9
  embd_kernel_size: 3
  embd_dim: 512
  embd_with_ln: true
  fpn_dim: 512
  fpn_with_ln: true
  fpn_start_level: 0
  head_dim: 512
  head_kernel_size: 3
  head_num_layers: 3
  head_with_ln: true
  max_buffer_len_factor: 8.0
  use_abs_pe: false
  use_rel_pe: false
  input_dim: 1024
opt:
  type: AdamW
  momentum: 0.9
  weight_decay: 0.05
  learning_rate: 0.0001
  epochs: 20
  warmup: false
  warmup_epochs: 0
  schedule_type: cosine
  schedule_steps: []
  schedule_gamma: 0.1
loader:
  batch_size: 2
  num_workers: 4
train_cfg:
  center_sample: radius
  center_sample_radius: 1.5
  loss_weight: 1.0
  cls_prior_prob: 0.01
  init_loss_norm: 250
  clip_grad_l2norm: 1.0
  head_empty_cls: []
  dropout: 0.0
  droppath: 0.1
  label_smoothing: 0.1
test_cfg:
  pre_nms_topk: 5000
  pre_nms_thresh: 0.001
  iou_threshold: 0.1
  min_score: 0.0
  max_seg_num: 2000
  nms_method: soft
  nms_sigma: 0.4
  duration_thresh: 0.05
  multiclass_nms: true
  voting_thresh: 0.75
  ext_score_file: null
